<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Bowl · Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--v:#1f3d2b;--vo:#12271a;--d:#c68a1f;--ds:#f3e3bd;--bg:#f4f5f0;--b:#e3e1d6;--t:#1c1f1d;--ts:#6b7268;--r:#b3432b;--ok:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}
h1,h2,h3,h4{font-family:Fraunces,serif;margin:0;font-weight:600}
nav{position:fixed;inset:0 auto 0 0;width:200px;background:var(--v);padding:22px 12px;display:flex;flex-direction:column;gap:4px;z-index:5}
nav b{font:600 1.15rem Fraunces,serif;color:#fff;padding:0 10px 18px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.75);font-weight:500}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:var(--d);color:var(--vo);font-weight:600}
nav button:focus-visible,.b:focus-visible,.g:focus-visible,.i:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--d);outline-offset:2px}
main{margin-left:200px;padding:30px 36px 60px;max-width:1100px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:1.6rem}
.sub{color:var(--ts);margin:-8px 0 18px}
.b,.g{font:600 .87rem Inter,sans-serif;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}
.b{background:var(--d);color:var(--vo)}
.g{background:#fff;border:1px solid var(--b);color:var(--ts)}
.i{all:unset;cursor:pointer;padding:5px 8px;border-radius:6px;color:var(--ts)}
.i:hover{background:#eceae0}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:18px}
.k div{background:#fff;border-radius:12px;padding:13px 16px;border:1px solid var(--b)}
.k span{display:block;font-size:.76rem;color:var(--ts)}
.k strong{font:600 1.3rem Fraunces,serif}
.tw{background:#fff;border:1px solid var(--b);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.78rem;color:var(--ts);padding:11px 14px;background:#faf9f5;border-bottom:1px solid var(--b);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--b);font-size:.9rem}
tr:last-child td{border:0}
.n{text-align:right;white-space:nowrap}
.chip{border:0;border-radius:99px;padding:3px 11px;font:600 .75rem Inter,sans-serif;cursor:pointer}
.e-Pendiente{background:var(--ds);color:#7a5510}
.e-Encamino{background:#dbe7f3;color:#245079}
.e-Entregado{background:#dcebe1;color:var(--ok);cursor:default}
.ev{background:#fff;border:1px dashed var(--b);border-radius:12px;padding:38px;text-align:center}
.ev p{color:var(--ts);margin:6px 0 0}
.card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px 18px;margin-bottom:10px;flex-wrap:wrap}
.card small{color:var(--ts)}
iframe{width:100%;height:calc(100vh - 70px);border:0;border-radius:12px;background:#fff}
#m{position:fixed;inset:0;background:rgba(18,20,17,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#m.on{display:flex}
#mc{background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:22px}
#mc.wide{max-width:640px}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--ts)}
input,select,textarea{font:400 .92rem Inter,sans-serif;padding:9px 11px;border:1px solid var(--b);border-radius:8px;color:var(--t);width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ir{display:grid;grid-template-columns:70px 90px 1fr 32px;gap:6px}
footer{display:flex;justify-content:flex-end;gap:10px}
h4{margin-top:8px;border-bottom:1px solid var(--b);padding-bottom:4px}
#bn{display:none;background:var(--ds);color:#7a5510;padding:9px 14px;border-radius:9px;margin-bottom:14px;font-size:.85rem}
#bn.on{display:flex;justify-content:space-between;gap:10px;align-items:center}
#t{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
#t div{background:var(--vo);color:#fff;padding:11px 16px;border-radius:9px;font-size:.86rem;max-width:300px}
#t .err{background:var(--r)}#t .ok{background:var(--ok)}
#imp{display:none}
@media(max-width:760px){
nav{inset:auto 0 0 0;width:100%;flex-direction:row;padding:6px;justify-content:space-around}
nav b{display:none}
nav button{padding:9px 6px;font-size:.72rem;text-align:center;flex:1}
main{margin:0;padding:20px 14px 90px}
.g2{grid-template-columns:1fr}.ir{grid-template-columns:60px 80px 1fr 30px}
iframe{height:calc(100vh - 100px)}}
@media(prefers-reduced-motion:no-preference){#mc{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
@media print{body>*:not(#imp){display:none!important}#imp{display:block;font-family:Fraunces,Georgia,serif;color:#000;padding:0}
#imp h1{font-size:26pt;margin-bottom:2pt}#imp h2{font-size:13pt;margin:16pt 0 4pt;border-bottom:1.5pt solid #1f3d2b;color:#1f3d2b}
#imp table{width:100%}#imp td{border:0;padding:3pt 0;font:10.5pt Inter,sans-serif}#imp li,#imp p{font:10.5pt/1.5 Inter,sans-serif}
#imp .ft td{border:1pt solid #ccc;padding:5pt 8pt}#imp .pie{margin-top:24pt;font:8pt Inter,sans-serif;color:#777}}
</style>
</head>
<body>
<nav>
  <b>Terra Bowl</b>
  <button data-t="Domicilios">🛵 Domicilios</button>
  <button data-t="Ventas">💵 Ventas</button>
  <button data-t="Gastos">🧾 Gastos</button>
  <button data-t="Costeo">🧮 Costeo</button>
  <button data-t="Recetas">📖 Recetas</button>
</nav>
<main><div id="bn"></div><div id="v"></div></main>
<div id="m"><div id="mc"></div></div>
<div id="t"></div>
<div id="imp"></div>

<script>
// ===== CONFIGURACIÓN =====
// API de esta app (Code.gs nuevo: Domicilios, Ventas, Gastos, Recetas)
const API = 'PEGA_AQUI_LA_URL_EXEC_DEL_NUEVO_APPS_SCRIPT';
// API del costeo que ya tienes (solo lectura: trae tus productos y precios)
const COSTEO_API = 'https://script.google.com/macros/s/AKfycbwFdFESZEjFdHaB2H6axo_DcvPorHiU35KQx4yq7Fy-fxLG2SGW-9YPmw7lnAxez1M2/exec';

// ===== UTILIDADES =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop = n => '$' + Math.round(+n || 0).toLocaleString('es-CO');
const hoy = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const nid = s => s.slice(0, 3).toUpperCase() + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const pj = s => { try { return JSON.parse(s) || {}; } catch (e) { return {}; } };
const L = {Direccion:'Dirección',Telefono:'Teléfono',Metodo:'Método de pago',Envio:'Envío',Cantidad:'Cant.',Precio:'Precio unit.'};
const lb = k => L[k] || k;
const S = {tab:'Domicilios', db:{Domicilios:[],Ventas:[],Gastos:[],Recetas:[]}, prod:[]};
const MONEY = ['Total','Monto','Precio','Envio'];

const M = {
  Domicilios:{t:'Domicilios', cols:['Fecha','Cliente','Direccion','Producto','Domiciliario','Estado','Total'],
    vacio:'Registra el primer pedido a domicilio con “Nuevo”.',
    f:[['Fecha','date'],['Cliente','text'],['Telefono','tel'],['Direccion','text'],['Producto','prod'],['Cantidad','number'],['Domiciliario','text'],['Envio','number'],['Estado','sel',['Pendiente','En camino','Entregado']]]},
  Ventas:{t:'Ventas', cols:['Fecha','Producto','Cantidad','Precio','Metodo','Total'],
    vacio:'Registra una venta o marca un domicilio como entregado y aparecerá aquí.',
    f:[['Fecha','date'],['Producto','prod'],['Cantidad','number'],['Precio','number'],['Metodo','sel',['Efectivo','Transferencia','Datáfono','Sin definir']],['Notas','text']]},
  Gastos:{t:'Gastos y costos', cols:['Fecha','Concepto','Tipo','Monto'],
    vacio:'Registra compras de insumos, arriendo, servicios y otros egresos.',
    f:[['Fecha','date'],['Concepto','text'],['Tipo','sel',['Insumos','Costo fijo','Costo variable','Otro']],['Monto','number'],['Notas','text']]}
};
const CAPAS = ['Base','Proteína','Vegetales / Frutas','Salsa / Dressing','Toppings / Crunch'];
const UNI = ['g','kg','ml','l','und','cda','cdta','taza'];

// ===== DATOS: lectura, escritura optimista, caché y errores =====
function toast(m, k) { const e = document.createElement('div'); e.className = k || ''; e.textContent = m; $('#t').appendChild(e); setTimeout(() => e.remove(), 3400); }
function banner(msg) { const b = $('#bn'); b.classList.toggle('on', !!msg); b.innerHTML = msg ? `<span>${esc(msg)}</span><button class="g" data-a="retry">Reintentar</button>` : ''; }

async function load() {
  if (API.includes('PEGA_AQUI')) { banner('Falta conectar la base de datos: pega la URL de tu nuevo Apps Script en la constante API de index.html.'); render(); return; }
  try {
    const j = await (await fetch(API)).json();
    if (!j.ok) throw new Error(j.error);
    S.db = j.data; localStorage.setItem('tb', JSON.stringify(j.data)); banner('');
  } catch (e) {
    try { S.db = JSON.parse(localStorage.getItem('tb')) || S.db; } catch (x) {}
    banner('Sin conexión con Google Sheets. Estás viendo la última copia guardada; los cambios no se enviarán.');
  }
  try { S.prod = (await (await fetch(COSTEO_API + '?action=getAll')).json()).data.productos || []; } catch (e) {}
  render();
}

async function post(action, sheet, row) {
  const j = await (await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, sheet, row})})).json();
  if (!j.ok) throw new Error(j.error);
}
async function save(sheet, row) {
  row.ID = row.ID || nid(sheet);
  const list = S.db[sheet], i = list.findIndex(x => x.ID === row.ID), old = list[i];
  i < 0 ? list.push(row) : list[i] = row; render();
  try { await post('save', sheet, row); localStorage.setItem('tb', JSON.stringify(S.db)); toast('Guardado', 'ok'); }
  catch (e) { i < 0 ? list.splice(list.indexOf(row), 1) : list[i] = old; render(); toast('No se guardó: ' + e.message, 'err'); }
}
async function del(sheet, id) {
  const list = S.db[sheet], i = list.findIndex(x => x.ID === id), old = list[i];
  list.splice(i, 1); render();
  try { await post('delete', sheet, {ID:id}); toast('Eliminado', 'ok'); }
  catch (e) { list.splice(i, 0, old); render(); toast('No se eliminó: ' + e.message, 'err'); }
}

// ===== LÓGICA ENTRE MÓDULOS =====
const precioDe = n => { const p = S.prod.find(x => x.NombreProducto === n); return p ? +p.PrecioVenta || 0 : 0; };

// Un domicilio entregado crea su venta automáticamente (una sola vez)
async function guardarDom(row) {
  row.ID = row.ID || nid('Domicilios');
  if (row.Estado === 'Entregado' && !row.VentaID) {
    row.VentaID = nid('Ventas');
    save('Ventas', {ID:row.VentaID, Fecha:row.Fecha, Producto:row.Producto, Cantidad:row.Cantidad, Precio:precioDe(row.Producto), Metodo:'Sin definir', Total:row.Cantidad * precioDe(row.Producto), Notas:'Domicilio de ' + row.Cliente});
    toast('Venta registrada. Define el método de pago en Ventas.');
  }
  save('Domicilios', row);
}
function avanzar(id) {
  const r = S.db.Domicilios.find(x => x.ID === id), next = {'Pendiente':'En camino','En camino':'Entregado'}[r.Estado];
  if (next) guardarDom({...r, Estado:next});
}

// ===== VISTAS =====
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const v = $('#v');
  v.innerHTML = S.tab === 'Costeo' ? '<iframe src="costeo.html" title="Costeo de recetas"></iframe>' : S.tab === 'Recetas' ? vRec() : vMod(S.tab);
}
function kpis(n) {
  const mes = hoy().slice(0, 7), sum = (a, f) => a.reduce((s, r) => s + (+r[f] || 0), 0), en = (a, p) => a.filter(r => String(r.Fecha).startsWith(p));
  const V = S.db.Ventas, G = S.db.Gastos, vm = en(V, mes), gm = en(G, mes);
  let k = [];
  if (n === 'Ventas') k = [['Hoy', cop(sum(en(V, hoy()), 'Total'))], ['Este mes', cop(sum(vm, 'Total'))], ['Gastos del mes', cop(sum(gm, 'Monto'))], ['Utilidad del mes', cop(sum(vm, 'Total') - sum(gm, 'Monto'))]]
    .concat(['Efectivo','Transferencia','Datáfono'].map(m => [m, cop(sum(vm.filter(r => r.Metodo === m), 'Total'))]));
  if (n === 'Gastos') k = [['Este mes', cop(sum(gm, 'Monto'))]].concat(['Insumos','Costo fijo','Costo variable','Otro'].map(t => [t, cop(sum(gm.filter(r => r.Tipo === t), 'Monto'))]));
  if (n === 'Domicilios') k = ['Pendiente','En camino','Entregado'].map(e => [e + (e === 'Entregado' ? ' hoy' : ''), S.db.Domicilios.filter(r => r.Estado === e && (e !== 'Entregado' || r.Fecha === hoy())).length]);
  return `<div class="k">${k.map(([a, b]) => `<div><span>${esc(a)}</span><strong>${b}</strong></div>`).join('')}</div>`;
}
function cell(n, c, r) {
  if (c === 'Estado') return `<button class="chip e-${esc(String(r.Estado).replace(' ', ''))}" data-a="adv" data-id="${r.ID}" title="Avanzar estado">${esc(r.Estado)}</button>`;
  return MONEY.includes(c) ? cop(r[c]) : esc(r[c]);
}
function vMod(n) {
  const m = M[n], rows = [...S.db[n]].sort((a, b) => String(b.Fecha).localeCompare(String(a.Fecha)));
  return `<header><h1>${m.t}</h1><button class="b" data-a="new">Nuevo registro</button></header>${kpis(n)}` +
    (rows.length ? `<div class="tw"><table><thead><tr>${m.cols.map(c => `<th>${lb(c)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r =>
      `<tr>${m.cols.map(c => `<td class="${MONEY.includes(c) || c === 'Cantidad' ? 'n' : ''}">${cell(n, c, r)}</td>`).join('')}<td class="n"><button class="i" data-a="edit" data-id="${r.ID}" title="Editar">✎</button><button class="i" data-a="del" data-id="${r.ID}" title="Eliminar">🗑</button></td></tr>`).join('')}</tbody></table></div>`
    : `<div class="ev"><h3>Aún no hay registros</h3><p>${m.vacio}</p></div>`);
}

// ===== MODAL Y FORMULARIOS =====
function modal(html, wide, onSubmit) {
  const c = $('#mc'); c.className = wide ? 'wide' : ''; c.innerHTML = html; $('#m').classList.add('on');
  const f = c.querySelector('form'); const first = f.querySelector('input,select'); if (first) first.focus();
  f.onsubmit = e => { e.preventDefault(); onSubmit(Object.fromEntries(new FormData(f)), f); close(); };
}
function close() { $('#m').classList.remove('on'); $('#mc').innerHTML = ''; }
function field([k, t, o], r) {
  const v = r[k] ?? (t === 'date' ? hoy() : '');
  if (t === 'sel') return `<label>${lb(k)}<select name="${k}">${o.map(x => `<option ${x == v ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`;
  if (t === 'prod') return `<label>Producto<input name="Producto" list="dlp" value="${esc(v)}" required autocomplete="off"><datalist id="dlp">${S.prod.map(p => `<option value="${esc(p.NombreProducto)}">`).join('')}</datalist></label>`;
  const req = ['Cliente','Concepto','Cantidad','Monto','Fecha'].includes(k) ? 'required' : '';
  return `<label>${lb(k)}<input name="${k}" type="${t}" ${t === 'number' ? 'step="any" min="0"' : ''} value="${esc(v)}" ${req}></label>`;
}
function form(n, id) {
  const m = M[n], r = S.db[n].find(x => x.ID === id) || (n === 'Domicilios' ? {Cantidad:1, Estado:'Pendiente'} : n === 'Ventas' ? {Cantidad:1} : {});
  modal(`<h3>${id ? 'Editar' : 'Nuevo'}: ${m.t}</h3><form>${m.f.map(f => field(f, r)).join('')}<footer><button type="button" class="g" data-x>Cancelar</button><button class="b">Guardar</button></footer></form>`, false, v => {
    const row = {...r, ...v, Cantidad:+v.Cantidad || 0};
    if (n === 'Ventas') { row.Precio = +v.Precio || 0; row.Total = row.Cantidad * row.Precio; }
    if (n === 'Gastos') row.Monto = +v.Monto || 0;
    if (n === 'Domicilios') { row.Envio = +v.Envio || 0; row.Total = row.Cantidad * precioDe(v.Producto) + row.Envio; return guardarDom(row); }
    save(n, row);
  });
  if (n === 'Ventas') { // al elegir producto se completa el precio del catálogo de costeo
    const f = $('#mc form'); f.Producto.addEventListener('input', () => { const p = precioDe(f.Producto.value); if (p) f.Precio.value = p; });
  }
}

// ===== RECETAS (módulo independiente) =====
function vRec() {
  const R = S.db.Recetas;
  return `<header><h1>Recetas</h1><button class="b" data-a="new">Nueva receta</button></header><p class="sub">Redacta y da formato a tus fichas. Este módulo es independiente: no cambia costos, ventas ni inventario.</p>` +
    (R.length ? R.map(r => { const d = pj(r.Datos); return `<div class="card"><div><h3>${esc(r.Nombre)}</h3><small>${esc([d.cat, d.tiempo, d.porciones && d.porciones + ' porciones'].filter(Boolean).join(', '))}</small></div><div><button class="g" data-a="pdf" data-id="${r.ID}">Descargar PDF</button><button class="i" data-a="edit" data-id="${r.ID}" title="Editar">✎</button><button class="i" data-a="del" data-id="${r.ID}" title="Eliminar">🗑</button></div></div>`; }).join('')
    : `<div class="ev"><h3>Aún no hay recetas</h3><p>Crea tu primera ficha con los cinco bloques.</p></div>`);
}
const irow = i => `<div class="ir"><input class="ic" placeholder="Cant." value="${esc(i.c)}"><select class="iu">${UNI.map(u => `<option ${u === i.u ? 'selected' : ''}>${u}</option>`).join('')}</select><input class="in" placeholder="Ingrediente" value="${esc(i.n)}"><button type="button" class="i" data-rm title="Quitar">✕</button></div>`;
function recForm(id) {
  const r = S.db.Recetas.find(x => x.ID === id) || {}, d = pj(r.Datos), c = d.comp || {}, ing = d.ings && d.ings.length ? d.ings : [{}];
  modal(`<h3>${id ? 'Editar' : 'Nueva'} receta</h3><form>
    <h4>1. Encabezado y ficha técnica</h4>
    <label>Nombre<input name="nombre" required value="${esc(r.Nombre)}"></label>
    <div class="g2"><label>Categoría / estilo<input name="cat" value="${esc(d.cat)}"></label><label>Tiempo de preparación<input name="tiempo" placeholder="25 min" value="${esc(d.tiempo)}"></label>
    <label>Porciones<input name="porciones" value="${esc(d.porciones)}"></label><label>Dificultad<select name="dif">${['Fácil','Media','Alta'].map(x => `<option ${x === d.dif ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
    <label>Calorías / macros<input name="cal" placeholder="520 kcal, P 32 g, C 48 g, G 18 g" value="${esc(d.cal)}"></label>
    <h4>2. Componentes del bowl</h4>${CAPAS.map((n, i) => `<label>${n}<input name="c${i}" value="${esc(c[n])}"></label>`).join('')}
    <h4>3. Ingredientes</h4><div id="ings" style="display:flex;flex-direction:column;gap:6px">${ing.map(irow).join('')}</div><button type="button" class="g" data-add>Agregar ingrediente</button>
    <h4>4. Instrucciones de preparación</h4><label>Un paso por línea<textarea name="pasos" rows="5">${esc(d.pasos)}</textarea></label>
    <h4>5. Notas del chef</h4><label>Sustituciones, emplatado, meal prep<textarea name="notas" rows="3">${esc(d.notas)}</textarea></label>
    <footer><button type="button" class="g" data-x>Cancelar</button><button class="b">Guardar receta</button></footer></form>`, true, (v, f) => {
    const dat = {cat:v.cat, tiempo:v.tiempo, porciones:v.porciones, dif:v.dif, cal:v.cal, pasos:v.pasos, notas:v.notas,
      comp:Object.fromEntries(CAPAS.map((n, i) => [n, v['c' + i]])),
      ings:[...f.querySelectorAll('.ir')].map(x => ({c:x.querySelector('.ic').value, u:x.querySelector('.iu').value, n:x.querySelector('.in').value})).filter(i => i.n.trim())};
    save('Recetas', {...r, Nombre:v.nombre, Datos:JSON.stringify(dat)});
  });
}
function pdf(id) {
  const r = S.db.Recetas.find(x => x.ID === id), d = pj(r.Datos), c = d.comp || {};
  $('#imp').innerHTML = `<h1>${esc(r.Nombre)}</h1><p>${esc(d.cat)}</p>
    <table class="ft"><tr><td><b>Tiempo</b><br>${esc(d.tiempo) || '—'}</td><td><b>Porciones</b><br>${esc(d.porciones) || '—'}</td><td><b>Dificultad</b><br>${esc(d.dif)}</td><td><b>Calorías / macros</b><br>${esc(d.cal) || '—'}</td></tr></table>
    <h2>Componentes del bowl</h2><table>${CAPAS.filter(n => c[n]).map(n => `<tr><td style="width:32%"><b>${n}</b></td><td>${esc(c[n])}</td></tr>`).join('')}</table>
    <h2>Ingredientes</h2><ul>${(d.ings || []).map(i => `<li>${esc([i.c, i.u].filter(Boolean).join(' '))} ${esc(i.n)}</li>`).join('')}</ul>
    <h2>Preparación</h2><ol>${(d.pasos || '').split('\n').filter(s => s.trim()).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    ${d.notas ? `<h2>Notas del chef</h2><p>${esc(d.notas).replace(/\n/g, '<br>')}</p>` : ''}<p class="pie">Terra Bowl</p>`;
  toast('En el diálogo de impresión elige “Guardar como PDF”.');
  setTimeout(() => window.print(), 350);
}

// ===== EVENTOS =====
document.querySelector('nav').onclick = e => { const b = e.target.closest('button'); if (b) { S.tab = b.dataset.t; render(); } };
document.addEventListener('click', e => {
  if (e.target.id === 'm' || e.target.closest('[data-x]')) return close();
  const add = e.target.closest('[data-add]'); if (add) return $('#ings').insertAdjacentHTML('beforeend', irow({}));
  const rm = e.target.closest('[data-rm]'); if (rm) { if (document.querySelectorAll('.ir').length > 1) rm.parentElement.remove(); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const {a, id} = b.dataset, rec = S.tab === 'Recetas';
  if (a === 'retry') load();
  if (a === 'new') rec ? recForm() : form(S.tab);
  if (a === 'edit') rec ? recForm(id) : form(S.tab, id);
  if (a === 'del' && confirm('¿Eliminar este registro? No se puede deshacer.')) del(S.tab, id);
  if (a === 'adv') avanzar(id);
  if (a === 'pdf') pdf(id);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
load();
</script>
</body>
</html>
